# pyproject.toml
[project]
name = "taskman"
version = "0.1.0"
description = "Python CLI wrapper for TaskWarrior"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
taskman = "taskman.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
